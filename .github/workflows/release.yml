name: Release

# Push a tag matching package.json's version (git tag v0.4.1 && git push origin v0.4.1).
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in this repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or later.
      - run: npm install -g npm@latest
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || (echo "::error::tag $GITHUB_REF_NAME != package.json v$version" && exit 1)
      - run: bun install --frozen-lockfile
      - run: bun run setup
      - run: bun run check
      - name: dist/ is built from this source
        run: |
          bun run build
          git diff --exit-code -- dist || (echo "::error::dist/ is stale: run bun run build and commit it" && exit 1)
      - run: npm publish --provenance --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
